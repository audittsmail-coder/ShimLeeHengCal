<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#081717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ชั่งกุ้ง">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>ชั่งน้ำหนักกุ้ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #081717;
    --bg-2: #0c2020;
    --panel: #0f2b2b;
    --panel-2: #123434;
    --line: #1c4444;
    --led: #ff5a36;
    --led-dim: #7a2a18;
    --aqua: #2dd4bf;
    --aqua-dim: #1a6b62;
    --text: #eaf6f3;
    --muted: #6f9d95;
    --muted-2: #4f7a72;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #0f2c2c 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding:20px 14px 30px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding:0 2px;
  }
  header h1{
    font-size:22px;
    font-weight:800;
    letter-spacing:0.02em;
    margin:0;
  }
  header h1 .fish{color:var(--aqua); font-weight:500;}
  header .count{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
  }

  /* Trip info: truck number + date */
  .info-bar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:14px;
  }
  .info-field{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
  }
  .info-field label{
    display:block;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted-2);
    font-weight:600;
    margin-bottom:3px;
  }
  .info-field input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:0;
  }
  .info-field input::placeholder{color:var(--muted-2); font-weight:400;}
  .info-field input[type="date"]{
    font-family:'JetBrains Mono',monospace;
    color-scheme:dark;
  }

  /* Scale display */
  .scale{
    background:linear-gradient(180deg,#0d2626,#081616);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px 16px 16px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
  }
  .scale::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--aqua-dim), transparent);
  }
  .scale-label{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted-2);
    font-weight:600;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .next-no{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:normal;
    text-transform:none;
    font-size:12px;
    color:var(--aqua);
    background:rgba(45,212,191,0.1);
    border:1px solid var(--aqua-dim);
    border-radius:20px;
    padding:3px 10px;
    font-weight:700;
  }
  .tare-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:#0a2222;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:14px;
  }
  .tare-row label{
    font-size:12.5px;
    color:var(--muted);
    flex:1;
  }
  .tare-row input{
    width:70px;
    background:#050f0f;
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    text-align:right;
    padding:6px 8px;
    outline:none;
    font-variant-numeric:tabular-nums;
  }
  .tare-row input:focus{border-color:var(--aqua);}
  .tare-row .unit{font-size:12.5px; color:var(--muted-2);}
  .readout{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    background:#050f0f;
    border-radius:12px;
    border:1px solid #163636;
    padding:12px 10px;
    margin-bottom:14px;
  }
  .readout input{
    -webkit-appearance:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--led);
    font-family:'JetBrains Mono',monospace;
    font-weight:800;
    font-size:36px;
    letter-spacing:0.03em;
    text-align:right;
    width:100%;
    text-shadow:0 0 14px rgba(255,90,54,0.5), 0 0 3px rgba(255,90,54,0.6);
    font-variant-numeric:tabular-nums;
  }
  .readout input::placeholder{color:var(--led-dim); text-shadow:none;}
  .readout .unit{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    font-weight:600;
    color:var(--muted);
    padding-bottom:4px;
  }
  .scale-actions{display:flex; gap:10px;}
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:15px 12px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-add{
    background:linear-gradient(180deg,#34e0c4,var(--aqua));
    color:#052321;
    box-shadow:0 8px 20px -8px rgba(45,212,191,0.55);
  }
  .btn-add:disabled{
    background:#1a3d3a;
    color:#4f7a72;
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn-undo{
    flex:none;
    width:52px;
    background:var(--panel-2);
    color:var(--muted);
    border:1px solid var(--line);
    font-size:18px;
  }

  /* Basket grid */
  .baskets-section{margin-top:22px;}
  .row-block{margin-bottom:14px;}
  .row-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-bottom:8px;
  }
  @media (min-width:480px){
    .row-grid{grid-template-columns:repeat(10,1fr);}
  }
  .basket{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 4px 7px;
    text-align:center;
    cursor:pointer;
    transition:border-color .12s ease, transform .08s ease;
  }
  .basket:active{transform:scale(0.96);}
  .basket:hover{border-color:var(--muted-2);}
  .basket .no{
    font-size:10px;
    color:var(--muted-2);
    font-family:'JetBrains Mono',monospace;
    margin-bottom:3px;
  }
  .basket .kg{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .basket .kg-edit{
    width:100%;
    background:#050f0f;
    border:1px solid var(--aqua);
    border-radius:6px;
    color:var(--aqua);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    text-align:center;
    padding:2px 0;
    outline:none;
    font-variant-numeric:tabular-nums;
    margin-bottom:5px;
  }
  .basket .edit-actions{
    display:flex;
    gap:4px;
  }
  .basket .edit-actions button{
    flex:1;
    border:none;
    border-radius:6px;
    padding:5px 0;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .basket .edit-confirm{background:var(--aqua); color:#052321;}
  .basket .edit-cancel{background:var(--panel-2); color:var(--muted); border:1px solid var(--line) !important;}
  .basket.last{
    border-color:var(--aqua-dim);
    box-shadow:0 0 0 1px var(--aqua-dim) inset;
  }
  .row-subtotal{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg-2);
    border-left:3px solid var(--aqua);
    border-radius:8px;
    padding:8px 14px;
    font-family:'JetBrains Mono',monospace;
  }
  .row-subtotal .lbl{font-size:12px; color:var(--muted); letter-spacing:0.05em;}
  .row-subtotal .row-totals{text-align:right; line-height:1.5;}
  .row-subtotal .row-gross{display:block; font-size:11px; color:var(--muted-2);}
  .row-subtotal .val{font-size:15px; font-weight:700; color:var(--aqua);}

  .empty{
    text-align:center;
    color:var(--muted-2);
    font-size:14px;
    padding:34px 10px;
    border:1px dashed var(--line);
    border-radius:14px;
    margin-top:18px;
  }

  /* Totals summary (static, in normal page flow — not fixed) */
  .footer{
    margin-top:20px;
  }
  .footer-inner{
    max-width:720px;
    margin:0 auto;
    background:linear-gradient(180deg,#0f2c2c,#0a1e1e);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
    box-shadow:0 10px 30px -18px rgba(0,0,0,0.6);
  }
  .footer .totals-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .footer .lbl{
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:2px;
  }
  .footer .total{
    font-family:'JetBrains Mono',monospace;
    font-size:28px;
    font-weight:800;
    color:var(--led);
    text-shadow:0 0 14px rgba(255,90,54,0.45);
    font-variant-numeric:tabular-nums;
  }
  .footer .gross-line{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:600;
    color:var(--text);
    margin-bottom:3px;
  }
  .footer .sub-label{
    display:block;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    margin-top:2px;
  }
  .footer .clear-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:12px;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .backup-row{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .backup-row button{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:12.5px;
    font-weight:600;
    padding:9px 10px;
    border-radius:10px;
    cursor:pointer;
  }
  .backup-row button:active{transform:scale(0.97);}
  .footer .clear-btn:active{transform:scale(0.96);}

  /* Custom confirm modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(4,10,10,0.7);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal-box{
    background:linear-gradient(180deg,#123434,#0c2020);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
  }
  .modal-box p{
    margin:0 0 18px;
    font-size:15px;
    color:var(--text);
    line-height:1.5;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:12px 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .modal-confirm{background:#ff5a36; color:#2a0e06;}
  .modal-cancel{background:var(--panel-2); color:var(--muted); border:1px solid var(--line) !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ชั่งกุ้ง<span class="fish"> 🦐</span></h1>
    <div style="text-align:right;">
      <div class="count" id="basketCount">0 ตะกร้า</div>
      <div id="storageNote" style="display:none; font-size:10px; color:#9a7a3f; margin-top:2px;">⚠ ข้อมูลจะหายเมื่อปิดหน้านี้</div>
    </div>
  </header>

  <div class="info-bar">
    <div class="info-field">
      <label for="truckInput">รถคันที่</label>
      <input id="truckInput" type="text" placeholder="เช่น 70-1234">
    </div>
    <div class="info-field">
      <label for="dateInput">วันที่</label>
      <input id="dateInput" type="date">
    </div>
  </div>

  <div class="scale">
    <div class="scale-label">น้ำหนักตะกร้าถัดไป</div>
    <div class="tare-row">
      <label for="tareInput">น้ำหนักตะกร้าเปล่า (หักออกทุกตะกร้า)</label>
      <input id="tareInput" class="cents-input" type="text" inputmode="numeric" pattern="[0-9]*" value="0.00">
      <span class="unit">กก.</span>
    </div>
    <div class="tare-row">
      <label for="percentInput">เปอร์เซ็นต์หัก (จากยอดหลังหักตะกร้า)</label>
      <input id="percentInput" class="cents-input" type="text" inputmode="numeric" pattern="[0-9]*" value="0.00">
      <span class="unit">%</span>
    </div>
    <div class="tare-row">
      <label for="sampleInput">น้ำหนักกุ้งตัวอย่าง (บวกเข้าสุทธิตรงๆ)</label>
      <input id="sampleInput" class="cents-input" type="text" inputmode="numeric" pattern="[0-9]*" value="0.00">
      <span class="unit">กก.</span>
    </div>
    <div style="display:flex; justify-content:center; margin-bottom:8px;">
      <span class="next-no" id="nextBasketNo">ตะกร้าที่ #1</span>
    </div>
    <div class="readout">
      <input id="weightInput" class="cents-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0.00">
      <div class="unit">กก.</div>
    </div>
    <div class="scale-actions">
      <button class="btn btn-undo" id="undoBtn" title="ลบตะกร้าล่าสุด">↺</button>
      <button class="btn btn-add" id="addBtn" disabled>+ เพิ่มตะกร้า</button>
    </div>
  </div>

  <div class="baskets-section" id="basketsSection"></div>
</div>

<div class="footer">
  <div class="footer-inner">
    <div>
      <div class="lbl">น้ำหนักรวมทั้งหมด • <span id="totalBasketCount">0</span> ตะกร้า</div>
      <div class="gross-line">ก่อนหักตะกร้า <span id="grandGross">0.00</span> กก.</div>
      <div class="gross-line">หลังหักตะกร้า <span id="grandNet">0.00</span> กก.</div>
      <div class="gross-line">หักเปอร์เซ็นต์ (<span id="percentLabel2">0</span>%) −<span id="percentDeductKg">0.00</span> กก.</div>
      <div class="gross-line">+ กุ้งตัวอย่าง <span id="sampleWeightLabel">0.00</span> กก.</div>
    </div>
    <div class="totals-row">
      <div class="total"><span id="grandTotal">0.00</span> กก.<span class="sub-label">สุทธิ</span></div>
      <button class="clear-btn" id="clearBtn">ล้างข้อมูล</button>
    </div>
    <div class="backup-row">
      <button type="button" id="exportBtn">⬇ บันทึกไฟล์สำรอง</button>
      <button type="button" id="importBtn">⬆ โหลดไฟล์สำรอง</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
    <div id="backupStatus" style="display:none; font-size:12px; text-align:center; padding:4px;"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="clearModal">
  <div class="modal-box">
    <p>ล้างข้อมูลตะกร้าทั้งหมดใช่หรือไม่?<br><span style="color:var(--muted); font-size:13px;">ไม่สามารถกู้คืนได้</span></p>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancel">ยกเลิก</button>
      <button class="modal-confirm" id="modalConfirm">ล้างข้อมูล</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'shrimp-weigh:data';
let baskets = []; // [{no, weight}] — weight is gross (as weighed, including basket)
let tareWeight = 0; // empty basket weight, subtracted from every basket
let percentDeduct = 0; // % deducted from the grand total, applied after tare
let sampleWeight = 0; // extra sample shrimp weight, added directly to the net final total
let truckNo = '';
let recordDate = '';
let editingIdx = null;

const input = document.getElementById('weightInput');
const tareInput = document.getElementById('tareInput');
const percentInput = document.getElementById('percentInput');
const sampleInput = document.getElementById('sampleInput');
const truckInput = document.getElementById('truckInput');
const dateInput = document.getElementById('dateInput');
const addBtn = document.getElementById('addBtn');
const undoBtn = document.getElementById('undoBtn');
const clearBtn = document.getElementById('clearBtn');
const basketsSection = document.getElementById('basketsSection');
const basketCount = document.getElementById('basketCount');
const grandTotalEl = document.getElementById('grandTotal');
const grandGrossEl = document.getElementById('grandGross');

function fmt(n){
  return n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function netWeight(gross){
  return Math.max(0, gross - (tareWeight || 0));
}

// Auto-decimal "cents entry": user types digits only (e.g. 6 2 3) and the
// value auto-formats with 2 decimal places from the right (→ 6.23), like a
// calculator/POS keypad — no manual decimal point needed for speed.
function formatCentsValue(raw){
  const digits = raw.replace(/\D/g, '').slice(0, 6); // cap at 9999.99
  const num = digits === '' ? 0 : parseInt(digits, 10);
  return (num / 100).toFixed(2);
}

function render(){
  basketCount.textContent = baskets.length + ' ตะกร้า';
  document.getElementById('totalBasketCount').textContent = baskets.length;
  document.getElementById('nextBasketNo').textContent = 'ตะกร้าที่ #' + (baskets.length + 1);

  let grossTotal = 0, netTotal = 0;
  baskets.forEach(b => { grossTotal += b.weight; netTotal += netWeight(b.weight); });
  const pct = percentDeduct || 0;
  const percentDeductKg = netTotal * (pct / 100);
  const finalTotal = netTotal - percentDeductKg + (sampleWeight || 0);
  grandGrossEl.textContent = fmt(grossTotal);
  document.getElementById('grandNet').textContent = fmt(netTotal);
  document.getElementById('percentLabel2').textContent = pct.toString();
  document.getElementById('percentDeductKg').textContent = fmt(percentDeductKg);
  document.getElementById('sampleWeightLabel').textContent = fmt(sampleWeight || 0);
  grandTotalEl.textContent = fmt(finalTotal);

  basketsSection.innerHTML = '';

  if(baskets.length === 0){
    basketsSection.innerHTML = '<div class="empty">ยังไม่มีตะกร้าที่ชั่ง — เริ่มกรอกน้ำหนักด้านบนได้เลย<br><span style="font-size:12px;">แตะที่ตะกร้าใดก็ได้ภายหลังเพื่อแก้ไขน้ำหนัก</span></div>';
    return;
  }

  const rowsCount = Math.ceil(baskets.length / 10);
  for(let r = 0; r < rowsCount; r++){
    const rowBaskets = baskets.slice(r*10, r*10+10);
    const rowBlock = document.createElement('div');
    rowBlock.className = 'row-block';

    const grid = document.createElement('div');
    grid.className = 'row-grid';
    rowBaskets.forEach((b, i) => {
      const idx = r*10 + i;
      const el = document.createElement('div');
      el.className = 'basket' + (idx === baskets.length - 1 ? ' last' : '');
      if(editingIdx === idx){
        el.innerHTML = `
          <div class="no">#${b.no}</div>
          <input class="kg-edit cents-input" data-idx="${idx}" type="text" inputmode="numeric" pattern="[0-9]*" value="${Number(b.weight).toFixed(2)}">
          <div class="edit-actions">
            <button type="button" class="edit-confirm" data-idx="${idx}">✓</button>
            <button type="button" class="edit-cancel" data-idx="${idx}">✕</button>
          </div>`;
        grid.appendChild(el);
      }else{
        el.innerHTML = `<div class="no">#${b.no}</div><div class="kg" data-idx="${idx}">${fmt(b.weight)}</div>`;
        el.addEventListener('click', () => {
          editingIdx = idx;
          render();
          const inp = basketsSection.querySelector(`.kg-edit[data-idx="${idx}"]`);
          if(inp){ inp.focus(); inp.select(); }
        });
        grid.appendChild(el);
      }
    });
    rowBlock.appendChild(grid);

    // subtotal only shown once row has entries; show running subtotal even for partial last row
    const rowGross = rowBaskets.reduce((s,b)=>s+b.weight,0);
    const subtotal = document.createElement('div');
    subtotal.className = 'row-subtotal';
    const rangeLabel = `แถวที่ ${r+1} (#${r*10+1}–#${r*10+rowBaskets.length})`;
    subtotal.innerHTML = `<span class="lbl">${rangeLabel}</span><span class="val">${fmt(rowGross)} กก.</span>`;
    rowBlock.appendChild(subtotal);

    basketsSection.appendChild(rowBlock);
  }
}

let storageOk = true;

function save(){
  if(!storageOk) return; // storage unavailable in this environment, keep working in-memory
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ baskets, tare: tareWeight, percent: percentDeduct, sample: sampleWeight, truckNo, recordDate }));
  }catch(e){
    storageOk = false; // auto-save unavailable here; app continues to work in-memory silently
    const note = document.getElementById('storageNote');
    if(note) note.style.display = 'block';
  }
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        baskets = parsed; // legacy format (no tare/truck/date)
      }else{
        baskets = parsed.baskets || [];
        tareWeight = parsed.tare || 0;
        percentDeduct = parsed.percent || 0;
        sampleWeight = parsed.sample || 0;
        truckNo = parsed.truckNo || '';
        recordDate = parsed.recordDate || '';
      }
    }
  }catch(e){
    // no existing data yet, or storage unavailable — start fresh in-memory
  }
  tareInput.value = Number(tareWeight).toFixed(2);
  percentInput.value = Number(percentDeduct).toFixed(2);
  sampleInput.value = Number(sampleWeight).toFixed(2);
  truckInput.value = truckNo;
  // default to today if no date has been saved yet
  if(!recordDate){
    const now = new Date();
    recordDate = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  }
  dateInput.value = recordDate;
  render();
}

function addBasket(){
  const v = parseFloat(input.value);
  if(isNaN(v) || v <= 0) return;
  baskets.push({ no: baskets.length + 1, weight: v });
  input.value = '';
  addBtn.disabled = true;
  render();
  save();
  input.focus();
}

function undoLast(){
  if(baskets.length === 0) return;
  baskets.pop();
  render();
  save();
}

function clearAll(){
  if(baskets.length === 0) return;
  document.getElementById('clearModal').classList.remove('hidden');
}

document.getElementById('modalCancel').addEventListener('click', () => {
  document.getElementById('clearModal').classList.add('hidden');
});
document.getElementById('modalConfirm').addEventListener('click', () => {
  baskets = [];
  editingIdx = null;
  render();
  save();
  document.getElementById('clearModal').classList.add('hidden');
});

function commitEdit(idx, rawValue){
  const v = parseFloat(rawValue);
  if(!isNaN(v) && v > 0){
    baskets[idx].weight = v;
    save();
  }
  editingIdx = null;
  render();
}

basketsSection.addEventListener('input', (e) => {
  if(!e.target.classList.contains('kg-edit')) return;
  e.target.value = formatCentsValue(e.target.value);
});

basketsSection.addEventListener('click', (e) => {
  const confirmBtn = e.target.closest('.edit-confirm');
  const cancelBtn = e.target.closest('.edit-cancel');
  if(confirmBtn){
    const idx = parseInt(confirmBtn.dataset.idx, 10);
    const inp = basketsSection.querySelector(`.kg-edit[data-idx="${idx}"]`);
    commitEdit(idx, inp ? inp.value : '');
  }else if(cancelBtn){
    editingIdx = null;
    render();
  }
});

basketsSection.addEventListener('keydown', (e) => {
  if(!e.target.classList.contains('kg-edit')) return;
  const idx = parseInt(e.target.dataset.idx, 10);
  if(e.key === 'Enter'){
    e.preventDefault();
    commitEdit(idx, e.target.value);
  }else if(e.key === 'Escape'){
    e.preventDefault();
    editingIdx = null;
    render();
  }
});
// Note: no auto-commit on blur/focusout — committing is done via the
// explicit ✓/✕ buttons or Enter/Escape keys, to avoid mobile keyboards
// firing blur before a button tap is registered.

truckInput.addEventListener('input', () => {
  truckNo = truckInput.value;
  save();
});
dateInput.addEventListener('input', () => {
  recordDate = dateInput.value;
  save();
});

percentInput.addEventListener('input', () => {
  percentInput.value = formatCentsValue(percentInput.value);
  const v = parseFloat(percentInput.value);
  percentDeduct = (!isNaN(v) && v >= 0) ? Math.min(v, 100) : 0;
  render();
  save();
});

sampleInput.addEventListener('input', () => {
  sampleInput.value = formatCentsValue(sampleInput.value);
  const v = parseFloat(sampleInput.value);
  sampleWeight = (!isNaN(v) && v >= 0) ? v : 0;
  render();
  save();
});

tareInput.addEventListener('input', () => {
  tareInput.value = formatCentsValue(tareInput.value);
  const v = parseFloat(tareInput.value);
  tareWeight = (!isNaN(v) && v >= 0) ? v : 0;
  render();
  save();
});

input.addEventListener('input', () => {
  input.value = formatCentsValue(input.value);
  const v = parseFloat(input.value);
  addBtn.disabled = !(!isNaN(v) && v > 0);
});
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); addBasket(); }
});
addBtn.addEventListener('click', addBasket);
undoBtn.addEventListener('click', undoLast);
clearBtn.addEventListener('click', clearAll);

function showBackupStatus(msg, isError){
  const el = document.getElementById('backupStatus');
  el.textContent = msg;
  el.style.color = isError ? '#ff8a65' : 'var(--aqua)';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function exportBackup(){
  const data = { baskets, tare: tareWeight, percent: percentDeduct, sample: sampleWeight, truckNo, recordDate, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateForName = (recordDate || 'data').replace(/-/g,'');
  const truckForName = (truckNo || '').trim().replace(/[^a-zA-Z0-9-]/g,'') || 'shrimp';
  a.href = url;
  a.download = `shrimp-weigh_${truckForName}_${dateForName}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showBackupStatus('✓ บันทึกไฟล์สำรองแล้ว', false);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      baskets = parsed.baskets || [];
      tareWeight = parsed.tare || 0;
      percentDeduct = parsed.percent || 0;
      sampleWeight = parsed.sample || 0;
      truckNo = parsed.truckNo || '';
      recordDate = parsed.recordDate || '';
      tareInput.value = Number(tareWeight).toFixed(2);
      percentInput.value = Number(percentDeduct).toFixed(2);
      sampleInput.value = Number(sampleWeight).toFixed(2);
      truckInput.value = truckNo;
      dateInput.value = recordDate;
      editingIdx = null;
      render();
      save();
      showBackupStatus('✓ โหลดข้อมูลจากไฟล์สำรองแล้ว', false);
    }catch(e){
      showBackupStatus('⚠ ไฟล์นี้ใช้ไม่ได้ — กรุณาเลือกไฟล์สำรองที่บันทึกจากแอปนี้', true);
    }
  };
  reader.readAsText(file);
}

document.getElementById('exportBtn').addEventListener('click', exportBackup);
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importBackup(file);
  e.target.value = ''; // allow re-selecting the same file later
});

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
